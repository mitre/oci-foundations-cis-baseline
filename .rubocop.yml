AllCops:
  NewCops: enable
  Exclude:
  - "update_controls.rb"
  - "validate_v7_mapping.rb"

Layout/LineLength:
  Max: 1500
  AllowURI: true
  IgnoreCopDirectives: true

Naming/FileName:
  Enabled: false

Metrics/BlockLength:
  Max: 1000

Metrics/MethodLength:
  Max: 40

Metrics/AbcSize:
  Max: 40

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

Lint/ConstantDefinitionInBlock:
  Enabled: false

# InSpec resource classes use `desc` DSL, not Ruby doc comments
Style/Documentation:
  Enabled: false

# InSpec.resource(1) does not use standard initialize patterns
Lint/MissingSuper:
  Enabled: false

# Common pattern for filter + transform (select/reject then map)
Style/MultilineBlockChain:
  Enabled: false

# Required for Profiles as it can introduce profile errors
Style/NumericPredicate:
  Enabled: false

Style/WordArray:
  Description: "Use %w or %W for an array of words. (https://rubystyle.guide#percent-w)"
  Enabled: false

Style/RedundantPercentQ:
  Enabled: true

Style/NestedParenthesizedCalls:
  Enabled: false

Style/TrailingCommaInHashLiteral:
  Description: "https://docs.rubocop.org/rubocop/cops_style.html#styletrailingcommainhashliteral"
  Enabled: true
  EnforcedStyleForMultiline: no_comma

Style/TrailingCommaInArrayLiteral:
  Enabled: true
  EnforcedStyleForMultiline: no_comma

Style/BlockDelimiters:
  Enabled: false

Lint/AmbiguousBlockAssociation:
  Enabled: false

Metrics/BlockNesting:
  Enabled: false

Lint/ShadowingOuterLocalVariable:
  Enabled: false

Style/FormatStringToken:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false